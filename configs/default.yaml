schema_version: "2.0"
coder:
  provider: deepseek
  model: deepseek-v4-pro
  fast_model: deepseek-flash
  action_format: json_object
  temperature: 0
  max_tokens: 16000
  context_max_bytes: 180000
# Domestic CNY per million tokens, verified 2026-09-13:
# https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
# Peak: Asia/Shanghai Mon-Fri 09:00-12:00 and 14:00-18:00; otherwise half price.
# Reserve at peak/all-cache-miss rates; settle by recorded request-start period.
pricing:
  deepseek/deepseek-flash:
    input_cny_per_million_tokens: 2
    output_cny_per_million_tokens: 8
    cache_hit_input_cny_per_million_tokens: 0.04
    off_peak_multiplier: 0.5
  deepseek/deepseek-v4-pro:
    input_cny_per_million_tokens: 9
    output_cny_per_million_tokens: 27
    cache_hit_input_cny_per_million_tokens: 0.30
    off_peak_multiplier: 0.5
budgets:
  max_cost_cny: 100
  campaign_max_cost_cny: 1500
  wall_clock_hours: 4
  decisions_per_session: 40
  sessions_per_task: 3
  followups: 3
  final_repairs: 3
sandbox:
  image: nepa-sandbox:refactor
  cpu: 2
  mem_gb: 4
  command_timeout_s: 120
  build_timeout_s: 180
