schema_version: "1.0"
coder:
  provider: deepseek
  model: deepseek-v4-pro
  fast_model: deepseek-flash
  temperature: 0
  max_tokens: 16000
  context_max_bytes: 180000
# Official USD/1M peak cache-miss rates, verified 2026-09-12:
# https://api-docs.deepseek.com/quick_start/pricing/
# deepseek-flash serves V4.1 Flash. Accounting is a conservative estimate:
# cache-hit discounts and half-price off-peak periods are not deducted.
pricing:
  deepseek/deepseek-flash:
    input_usd_per_million_tokens: 0.30
    output_usd_per_million_tokens: 1.20
budgets:
  max_cost_usd: 100
  campaign_max_cost_usd: 300
  wall_clock_hours: 4
  decisions_per_session: 40
  sessions_per_task: 3
  followups: 3
  final_repairs: 3
sandbox:
  image: nepa-sandbox:refactor
  cpu: 2
  mem_gb: 4
  command_timeout_s: 120
  build_timeout_s: 180
