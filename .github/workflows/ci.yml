name: nepa-ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: docker build -t nepa-sandbox:refactor -f docker/sandbox.Dockerfile .
      - run: uv run ruff check nepa tests
      - run: uv run mypy nepa
      - run: uv run pytest -q -m "not live_e2e"
      - run: uv run nepa lint spec gold_file/specIR.json
      - run: uv run nepa lint target gold_file/target.json --spec gold_file/specIR.json
      - run: uv run nepa lint acceptance gold_file/acceptance.json --spec gold_file/specIR.json
      - run: uv build
