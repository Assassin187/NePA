[project]
name = "nepa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
nepa = "nepa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "types-PyYAML>=6,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["nepa*"]

[tool.setuptools.package-data]
nepa = ["agents/prompts/*.md", "schemas/*.json", "schemas/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sandbox_integration: actual network-disabled container checks",
  "live_e2e: paid real API generation, opt-in only",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "F401", "F402", "F541", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
