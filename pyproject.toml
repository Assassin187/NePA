[project]
name = "nepa"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "pytest>=8,<9",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
nepa = "nepa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["nepa*"]

[tool.setuptools.package-data]
nepa = ["templates/*", "agents/prompts/*.md", "schemas/*.json", "schemas/examples/*.json"]

[tool.pytest.ini_options]
markers = [
  "s5_epoch: end-to-end S5 epoch materialization checks",
  "s6_execution: end-to-end S6 ordinary task execution checks",
  "s6_lease: end-to-end S6 F1 lease execution checks",
  "metric_contract: deterministic M1 metric contract checks",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "F401", "F402", "F541", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "^nepa/(?!speclib/materialization\\.py$|stages/s5_materialization\\.py$|tools/)"
