[project]
name = "nepa"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "pytest>=8,<9",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
nepa = "nepa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["nepa*"]
