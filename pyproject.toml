[project]
name = "nepa"
version = "0.1.0"
description = "NePA: Network Protocol Agent — 自动化网络协议代码生成智能体系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "paho-mqtt>=2.0",
]

[project.scripts]
nepa = "nepa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(id): 标注该测试验证的需求条目（gold 测试集用，见设计文档 5.3）",
    "integration: 需要真实外部服务（LLM API、docker）的测试，默认跳过",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
